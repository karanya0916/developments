<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - {{ company_short }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #0b1120 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }
    .register-card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="register-card p-4 p-md-5">
  <div class="text-center mb-4">
    <img src="{{ url_for('static', filename='images/mcb_logo.svg') }}" alt="MCB Logo" height="48" class="mb-3">
    <h4 class="fw-bold text-dark">Create Staff Account</h4>
    <p class="text-muted small">Role-Based Access Control Registration</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('auth.register') }}">
    <div class="row g-3 mb-3">
      <div class="col-12">
        <label class="form-label small fw-bold text-dark">Full Legal Name *</label>
        <input type="text" name="full_name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
      </div>

      <div class="col-md-6">
        <label class="form-label small fw-bold text-dark">Username *</label>
        <input type="text" name="username" class="form-control" placeholder="ramesh_eng" required>
      </div>

      <div class="col-md-6">
        <label class="form-label small fw-bold text-dark">Contact Phone</label>
        <input type="tel" name="phone" class="form-control" placeholder="10-digit phone">
      </div>

      <div class="col-12">
        <label class="form-label small fw-bold text-dark">Email Address *</label>
        <input type="email" name="email" class="form-control" placeholder="ramesh@mcb.com" required>
      </div>

      <div class="col-12">
        <label class="form-label small fw-bold text-dark">Assigned Role *</label>
        <select name="role" class="form-select" required>
          <option value="Site Engineer" selected>Site Engineer (Site Diary & Progress Upload)</option>
          <option value="Project Manager">Project Manager (Schedules & Sub-tasks)</option>
          <option value="Inventory Manager">Inventory Manager (Material Stock & Logistics)</option>
          <option value="Administrator">Administrator (Executive Oversight)</option>
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label small fw-bold text-dark">Password *</label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
      </div>

      <div class="col-md-6">
        <label class="form-label small fw-bold text-dark">Confirm Password *</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
      </div>
    </div>

    <button type="submit" class="btn btn-mcb-primary w-100 py-2 fw-bold mb-3">
      <i class="bi bi-person-plus-fill me-1"></i> Register Account
    </button>
  </form>

  <div class="text-center small text-muted">
    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-warning-emphasis fw-semibold">Sign in here</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
